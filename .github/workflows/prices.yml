name: price-snapshot

# Snapshots FPL's price-change and availability fields once a day. The commits themselves are the
# time series (git-scraper pattern), which also keeps the repo active — GitHub disables scheduled
# workflows after 60 days of inactivity in a public repo, and these commits reset that clock for
# gameweek.yml too.
#
# This ran thirteen times a day, densest around the 00:00 UK price change, to train a model of when
# prices move. GitHub fired about five of the thirteen, one to two hours late, so only 40% of moves
# were bracketed closely enough to learn from; even so, by 2026-27 GW9 the model had 49 rises and
# 226 falls and separated them almost perfectly in-sample (AUC 0.999), so more readings add little. What still
# needs a fresh reading is ownership, which the minutes recalibration fits on, and the
# availability flags that time the news risk before a deadline. A day's resolution serves both.
#
# The run sits after the change in both BST (23:00 UTC) and GMT (00:00 UTC), with room for the
# scheduler's lag, so consecutive readings bracket exactly one change and a plan run during the day
# reads the position after the latest change rather than before it.
on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping runs would both try to push, and the loser wastes a full retry cycle.
  group: price-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --no-dev

      - name: Take snapshot
        run: uv run fpl prices snapshot

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "fpl-price-bot"
          git config user.email "fpl-price-bot@users.noreply.github.com"
          git add data/snapshots/prices
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "prices: snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another snapshot may have landed while this one ran; rebase rather than fail,
          # since losing a snapshot to a push race defeats the point of the job.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $attempt); rebasing"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
