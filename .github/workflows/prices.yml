name: price-snapshot

# Snapshots FPL's price-change fields around the clock. The commits themselves are the time
# series (git-scraper pattern), which also keeps the repo active — GitHub disables scheduled
# workflows after 60 days of inactivity, and these commits reset that clock.
#
# Prices move at 00:00 UK, listed exactly in game_config.settings.price_change_deadlines.
# We sample every 20 minutes across that window so calibration has a tight pre-move reading,
# and hourly the rest of the day. GitHub's scheduler drifts by 5-15+ minutes under load, so the
# dense window is deliberately wider than the event it is trying to bracket.
# Cadence was cut roughly 60% (from ~34 snapshots a day to ~13) once four days of logging
# established what the fields do. Prices move once daily at 23:00 UTC, and price_change_percent is
# a signed progress bar against a threshold of 100 with price_change_hourly_rate giving its
# derivative — so a reading close to the deadline plus the rate is enough to project the move.
# Dense sampling through the afternoon was measuring a curve we can already extrapolate.
on:
  schedule:
    # Around the change itself: every 30 minutes from 21:00 to 23:59 UTC, so the final
    # pre-change state is always captured within half an hour.
    - cron: "11,41 21-23 * * *"
    # Immediately after, to record what actually changed.
    - cron: "13 0 * * *"
    # Every three hours the rest of the day: enough to track the trajectory building through the
    # day without re-measuring a slope we can compute.
    - cron: "17 3,6,9,12,15,18 * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping runs would both try to push, and the loser wastes a full retry cycle.
  group: price-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --no-dev

      - name: Take snapshot
        run: uv run fpl prices snapshot

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "fpl-price-bot"
          git config user.email "fpl-price-bot@users.noreply.github.com"
          git add data/snapshots/prices
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "prices: snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another snapshot may have landed while this one ran; rebase rather than fail,
          # since losing a snapshot to a push race defeats the point of the job.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $attempt); rebasing"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
