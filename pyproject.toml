[project]
name = "fplass"
version = "0.1.0"
description = "Fantasy Premier League 2026/27 expert: Monte Carlo transfer and chip planning"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
    "pulp>=2.9",
    "typer>=0.12",
    "highspy>=1.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
fpl = "fplass.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# PuLP 3.x warns about its own 4.0 API migration on every variable it creates, which buries
# real output under thousands of lines.
filterwarnings = ["ignore:.*deprecated.*:DeprecationWarning:pulp.*"]
markers = ["slow: replays real seasons and takes minutes"]

[tool.ruff]
line-length = 100
target-version = "py312"
